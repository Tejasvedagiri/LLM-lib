[project]
name = "llm-lib"
version = "0.1.0"
description = "One LLM client for every app: local servers (colibri, LM Studio, llama.cpp, vLLM, SGLang, Ollama, ...), hosted OpenAI-compatible APIs and Anthropic, sync and async."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Tejasvedagiri", email = "tejasvedagiri1223@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13.1",
]

[project.optional-dependencies]
# Only needed for provider="anthropic"
anthropic = ["anthropic>=1.12.1"]

[dependency-groups]
dev = [
    "anthropic>=1.12.1",
    "llm-lib-build",  # `uv run build`
    "pytest>=8",
    "ruff>=0.17.2",
]

[tool.uv.sources]
llm-lib-build = { path = "tools/build", editable = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
