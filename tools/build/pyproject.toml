[project]
name = "llm-lib-build"
version = "0.1.0"
description = "`uv run build` for llm-lib: the sdist tarball and wheel in dist/. A dev tool, not shipped with llm-lib."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
build = "llm_lib_build:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
